<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Time Tracker — Tweed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    /* Tweed Brand Colors */
    --teal:#08ffb1;
    --teal-dim:#06d494;
    --teal-glow:rgba(8,255,177,.12);
    --teal-glow2:rgba(8,255,177,.06);
    --dark:#0b0c13;
    --dark2:#10111c;
    --dark3:#161825;
    --dark4:#1c1f2e;
    --dark5:#242738;
    --white:#ffffff;
    --white2:#c8ccd8;
    --white3:#8a8fa6;
    --border:#1e2130;
    --border2:#2a2d42;
    --red:#ff5c5c;
    --orange:#ffb347;
    --radius:8px;
  }
  body{
    font-family:"Inter",sans-serif;
    font-optical-sizing:auto;
    background:var(--dark);
    color:var(--white);
    min-height:100vh;
    padding:0 20px 60px;
  }

  /* Decorative Unicorn Studio scene, isolated behind every app surface. */
  body{isolation:isolate}
  .aura-background-component{
    position:fixed;inset:0;z-index:-1;pointer-events:none;
    overflow:hidden;background:var(--dark);
  }
  .aura-background-scene{position:absolute;inset:0}
  .background-toggle{
    position:fixed;right:12px;bottom:12px;z-index:10;
    padding:7px 10px;border:1px solid var(--border2);border-radius:6px;
    background:var(--dark2);color:var(--white2);font:inherit;font-size:.7rem;cursor:pointer;
  }
  .background-toggle:focus-visible{outline:2px solid var(--teal);outline-offset:3px}
  .background-toggle[hidden]{display:none}
  @media (prefers-reduced-motion:reduce){
    .aura-background-scene,.background-toggle{display:none}
  }

  /* HEADER */
  .app-header{
    max-width:860px;
    margin:0 auto;
    padding:28px 0 24px;
    display:flex;
    align-items:center;
    gap:14px;
  }
  .app-header .logo{height:28px;opacity:.9}
  .app-header .divider{width:1px;height:24px;background:var(--border2)}
  .app-header h1{font-size:1.1rem;font-weight:700;color:var(--white);letter-spacing:-.02em}
  .app-header h1 span{color:var(--teal);font-weight:500}

  /* NEW TASK FORM */
  .new-task-form{
    display:flex;gap:8px;max-width:860px;margin:0 auto 28px;flex-wrap:wrap;
    background:var(--dark2);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:14px 16px;
  }
  .new-task-form input{
    flex:1;min-width:180px;padding:10px 14px;
    background:var(--dark3);
    border:1px solid var(--border);
    border-radius:6px;
    color:var(--white);
    font-family:"Inter",sans-serif;
    font-size:.875rem;font-weight:500;
    outline:none;transition:border .2s,box-shadow .2s;
  }
  .new-task-form input:focus{border-color:var(--teal);box-shadow:0 0 0 2px var(--teal-glow)}
  .new-task-form input::placeholder{color:var(--white3);font-weight:400}

  .btn{
    padding:10px 20px;border:none;border-radius:6px;cursor:pointer;
    font-family:"Inter",sans-serif;font-size:.8rem;font-weight:700;
    letter-spacing:.01em;text-transform:uppercase;
    transition:all .15s;
  }
  .btn-start{background:var(--teal);color:var(--dark)}
  .btn-start:hover{background:#2bffbe;box-shadow:0 0 20px var(--teal-glow)}
  .btn-pause{background:var(--orange);color:var(--dark)}
  .btn-resume{background:var(--teal);color:var(--dark)}
  .btn-done{background:transparent;color:var(--teal);border:1px solid var(--teal)}
  .btn-done:hover{background:var(--teal);color:var(--dark)}
  .btn-pause:hover{opacity:.85}
  .btn-resume:hover{background:#2bffbe;box-shadow:0 0 16px var(--teal-glow)}
  .btn:disabled{opacity:.3;cursor:not-allowed}

  /* DAY SECTIONS */
  .day-section{
    max-width:860px;margin:0 auto 20px;
    background:var(--dark2);
    border-radius:var(--radius);
    border:1px solid var(--border);
    overflow:hidden;
  }
  .day-header{
    padding:12px 20px;
    background:var(--dark3);
    font-weight:700;font-size:.85rem;
    display:flex;justify-content:space-between;align-items:center;
    letter-spacing:.01em;text-transform:uppercase;color:var(--white2);
  }
  .day-header .day-total{color:var(--teal);font-size:.8rem;font-weight:600;text-transform:none}

  .task-card{
    padding:14px 20px;border-bottom:1px solid var(--border);
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    transition:background .15s;
  }
  .task-card:hover{background:var(--teal-glow2)}
  .task-card:last-child{border-bottom:none}
  .task-info{flex:1;min-width:200px}
  .task-name{font-weight:600;font-size:.9rem;color:var(--white)}
  .task-client{color:var(--teal);font-size:.78rem;margin-top:3px;font-weight:500}
  .task-dates{color:var(--white3);font-size:.72rem;margin-top:3px}
  .task-timer{
    font-family:"Inter",monospace;font-size:1.25rem;
    min-width:100px;text-align:right;font-weight:700;
    font-variant-numeric:tabular-nums;
  }
  .task-timer.running{color:var(--teal);text-shadow:0 0 12px var(--teal-glow)}
  .task-timer.paused{color:var(--orange)}
  .task-timer.done{color:var(--white3)}
  .task-actions{display:flex;gap:6px}
  .task-actions .btn{padding:6px 14px;font-size:.7rem}
  .task-card.completed{opacity:.5}
  .task-card.completed .task-name{text-decoration:line-through;text-decoration-color:var(--white3)}
  .badge-done{
    display:inline-block;
    background:var(--teal);color:var(--dark);
    font-size:.6rem;font-weight:800;text-transform:uppercase;letter-spacing:.04em;
    padding:2px 8px;border-radius:20px;margin-left:8px;vertical-align:middle;
  }

  /* BREAKDOWN SECTIONS */
  .breakdowns{max-width:860px;margin:32px auto 0}
  .breakdowns-title{
    font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;
    color:var(--white3);margin-bottom:12px;padding-left:2px;
  }
  .breakdown-section{
    background:var(--dark2);border:1px solid var(--border);
    border-radius:var(--radius);margin-bottom:20px;overflow:hidden;
  }
  .breakdown-header{
    padding:14px 20px;background:var(--dark3);
    font-weight:700;font-size:.85rem;
    display:flex;justify-content:space-between;align-items:center;
    color:var(--white2);
  }
  .breakdown-header .total-hours{color:var(--teal);font-weight:600;font-size:.85rem}
  .breakdown-body{padding:20px}
  .client-row{
    display:flex;justify-content:space-between;align-items:center;
    padding:9px 0;border-bottom:1px solid var(--border);
  }
  .client-row:last-child{border-bottom:none}
  .client-name{font-weight:600;font-size:.88rem}
  .client-stats{color:var(--white3);font-size:.82rem}
  .charts-container{display:flex;gap:20px;margin-top:20px;flex-wrap:wrap}
  .chart-box{flex:1;min-width:280px;max-height:300px;display:flex;align-items:center;justify-content:center}

  /* PREVIOUS WEEKS */
  .prev-weeks{margin-top:16px;padding-top:16px;border-top:1px solid var(--border)}
  .prev-weeks h4{color:var(--white3);font-size:.75rem;margin-bottom:8px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
  .week-link{
    display:inline-block;background:var(--dark4);color:var(--teal);
    padding:5px 12px;border-radius:6px;margin:3px 4px 3px 0;cursor:pointer;
    font-size:.78rem;font-weight:600;border:1px solid var(--border);transition:all .15s;
  }
  .week-link:hover{background:var(--teal);color:var(--dark);border-color:var(--teal)}

  /* MODAL */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(5,6,10,.8);
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    display:flex;align-items:center;justify-content:center;z-index:1000;
    opacity:0;pointer-events:none;transition:opacity .2s;
  }
  .modal-overlay.active{opacity:1;pointer-events:auto}
  .modal{
    background:var(--dark2);border:1px solid var(--border2);
    border-radius:var(--radius);padding:28px;max-width:620px;width:92%;max-height:80vh;overflow-y:auto;
  }
  .modal h3{margin-bottom:16px;color:var(--teal);font-size:1rem}
  .modal .close-btn{float:right;background:none;border:none;color:var(--white3);font-size:1.4rem;cursor:pointer;line-height:1}
  .modal .close-btn:hover{color:var(--teal)}
  .modal .charts-container{flex-direction:column}
  .modal .chart-box{max-height:250px}

  .empty-state{text-align:center;padding:50px 20px;color:var(--white3);font-size:.88rem}
  .empty-state span{color:var(--teal)}

  /* MANUAL TASK MODAL */
  .manual-modal-form{display:flex;flex-direction:column;gap:12px}
  .manual-modal-form label{font-size:.78rem;font-weight:700;color:var(--white2);text-transform:uppercase;letter-spacing:.04em}
  .manual-modal-form input{
    width:100%;padding:10px 14px;
    background:var(--dark3);border:1px solid var(--border);border-radius:6px;
    color:var(--white);font-family:"Inter",sans-serif;font-size:.875rem;font-weight:500;
    outline:none;transition:border .2s,box-shadow .2s;
  }
  .manual-modal-form input:focus{border-color:var(--teal);box-shadow:0 0 0 2px var(--teal-glow)}
  .manual-modal-form input::placeholder{color:var(--white3);font-weight:400}
  .manual-modal-form .btn-submit{margin-top:6px;width:100%}
  .manual-modal-form .time-hint{font-size:.72rem;color:var(--white3);font-weight:400;text-transform:none;letter-spacing:0;margin-top:-6px}

  /* BTN MANUAL */
  .btn-manual{
    background:transparent;color:var(--white3);border:1px dashed var(--border2);
    font-size:.78rem;font-weight:600;padding:8px 16px;
  }
  .btn-manual:hover{color:var(--teal);border-color:var(--teal)}

  /* EDIT TIME ICON */
  .edit-time-btn{
    background:none;border:none;cursor:pointer;
    color:var(--white3);font-size:.85rem;padding:2px 4px;
    margin-left:4px;vertical-align:middle;
    transition:color .15s;line-height:1;
  }
  .edit-time-btn:hover{color:var(--teal)}

  /* EXPORT SECTION */
  .export-section{
    max-width:860px;margin:32px auto 0;
    padding:20px 0;border-top:1px solid var(--border);
    display:flex;align-items:center;justify-content:space-between;
  }
  .export-section .export-label{color:var(--white3);font-size:.82rem}
  .btn-export{
    background:transparent;color:var(--teal);border:1px solid var(--border2);
    padding:10px 24px;font-size:.78rem;
  }
  .btn-export:hover{border-color:var(--teal);box-shadow:0 0 14px var(--teal-glow)}

  /* Scrollbar */
  ::-webkit-scrollbar{width:6px}
  ::-webkit-scrollbar-track{background:var(--dark)}
  ::-webkit-scrollbar-thumb{background:var(--dark5);border-radius:3px}
  ::-webkit-scrollbar-thumb:hover{background:var(--border2)}

  @media(max-width:600px){
    .new-task-form{flex-direction:column}
    .task-card{flex-direction:column;align-items:flex-start}
    .task-timer{text-align:left}
    .charts-container{flex-direction:column}
    .app-header{padding:20px 0 18px}
  }
</style>
</head>
<body>
<div class="aura-background-component" aria-hidden="true">
  <div id="tweed-aura" class="aura-background-scene"></div>
</div>
<button id="background-toggle" class="background-toggle" type="button" aria-pressed="false" hidden>Pausar fundo</button>


<div class="app-header">
  <img class="logo" src="https://raw.githubusercontent.com/agenciatweed/brand-guidelines-tweed/main/logos/logo_tweed_teal.png" alt="Tweed" onerror="this.style.display='none'">
  <div class="divider"></div>
  <h1>Time <span>Tracker</span></h1>
  <div id="sync-status" style="font-size:.7rem;margin-top:4px;height:14px;"></div>
</div>

<div class="new-task-form">
  <input type="text" id="taskName" placeholder="Nome da tarefa" autofocus>
  <input type="text" id="taskClient" placeholder="Cliente" list="clientList">
  <datalist id="clientList"></datalist>
  <button class="btn btn-start" onclick="createTask()">Iniciar</button>
  <button class="btn btn-manual" onclick="openManualModal()">+ Manual</button>
</div>

<div id="tasksContainer"></div>
<div class="breakdowns" id="breakdownsContainer"></div>

<!-- Export -->
<div class="export-section">
  <span class="export-label">Exportar todas as tarefas registradas como CSV</span>
  <button class="btn btn-export" onclick="exportCSV()">Exportar CSV</button>
</div>

<!-- Week Modal -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <button class="close-btn" onclick="closeModal()">&times;</button>
    <h3 id="modalTitle"></h3>
    <div id="modalBody"></div>
  </div>
</div>

<!-- Manual Task Modal -->
<div class="modal-overlay" id="manualOverlay" onclick="closeManualModal(event)">
  <div class="modal" onclick="event.stopPropagation()" style="max-width:420px">
    <button class="close-btn" onclick="closeManualModal()">&times;</button>
    <h3>Adicionar tarefa manual</h3>
    <div class="manual-modal-form">
      <div>
        <label>Nome da tarefa</label>
        <input type="text" id="manualName" placeholder="Ex: Revisão de contrato">
      </div>
      <div>
        <label>Cliente</label>
        <input type="text" id="manualClient" placeholder="Ex: Cliente X" list="clientList">
      </div>
      <div>
        <label>Tempo gasto (minutos)</label>
        <input type="number" id="manualMinutes" placeholder="Ex: 45" min="1" step="1">
        <div class="time-hint">Insira o tempo total em minutos que a tarefa durou</div>
      </div>
      <button class="btn btn-start btn-submit" onclick="createManualTask()">Adicionar Tarefa</button>
    </div>
  </div>
</div>

<!-- Edit Time Modal -->
<div class="modal-overlay" id="editTimeOverlay" onclick="closeEditTimeModal(event)">
  <div class="modal" onclick="event.stopPropagation()" style="max-width:380px">
    <button class="close-btn" onclick="closeEditTimeModal()">&times;</button>
    <h3>Corrigir tempo da tarefa</h3>
    <div class="manual-modal-form">
      <div>
        <label>Tempo correto (minutos)</label>
        <input type="number" id="editTimeMinutes" placeholder="Ex: 30" min="0" step="1">
        <div class="time-hint" id="editTimeHint"></div>
      </div>
      <button class="btn btn-start btn-submit" onclick="saveEditedTime()">Salvar</button>
    </div>
  </div>
</div>

<script>
// ===== DATA LAYER (API + localStorage cache) =====
const STORAGE_KEY = 'timetracker_v2';
const API_URL = '/api/data';
// Set this if you configured API_SECRET on Vercel:
const API_SECRET = '';

let data = {tasks:[], archivedWeeks:[]};
let _saveTimeout = null;
let _isSaving = false;
let _dataLoaded = false;

function loadLocalCache(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return {tasks:[], archivedWeeks:[]};
}

function saveLocalCache(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }catch(e){}
}

async function loadDataFromAPI(){
  try{
    const headers = {};
    if(API_SECRET) headers['X-Api-Secret'] = API_SECRET;
    const resp = await fetch(API_URL, {headers});
    if(!resp.ok) throw new Error('API ' + resp.status);
    const remote = await resp.json();
    if(remote && (remote.tasks || remote.archivedWeeks)){
      return remote;
    }
  }catch(e){
    console.warn('API load failed, using local cache:', e.message);
  }
  return null;
}

async function saveDataToAPI(){
  _isSaving = true;
  updateSyncIndicator('saving');
  try{
    const headers = {'Content-Type':'application/json'};
    if(API_SECRET) headers['X-Api-Secret'] = API_SECRET;
    const resp = await fetch(API_URL, {
      method:'POST', headers, body: JSON.stringify(data)
    });
    if(!resp.ok) throw new Error('API ' + resp.status);
    updateSyncIndicator('saved');
  }catch(e){
    console.warn('API save failed:', e.message);
    updateSyncIndicator('error');
  }
  _isSaving = false;
}

function saveData(){
  // Always save to localStorage immediately (cache)
  saveLocalCache();
  // Debounce API saves (2 seconds)
  if(_saveTimeout) clearTimeout(_saveTimeout);
  _saveTimeout = setTimeout(()=> saveDataToAPI(), 2000);
}

function updateSyncIndicator(state){
  let el = document.getElementById('sync-status');
  if(!el) return;
  if(state==='saving'){ el.textContent='Salvando...'; el.style.color='#f1c40f'; }
  else if(state==='saved'){ el.textContent='Sincronizado ✓'; el.style.color='#08ffb1'; setTimeout(()=>{ if(el.textContent==='Sincronizado ✓') el.textContent=''; },3000); }
  else if(state==='error'){ el.textContent='Erro ao sincronizar ✗'; el.style.color='#e74c3c'; }
  else if(state==='loading'){ el.textContent='Carregando...'; el.style.color='#f1c40f'; }
}

// ===== HELPERS =====
function genId(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function nowISO(){ return new Date().toISOString(); }

function formatDuration(ms){
  if(ms<0) ms=0;
  const s = Math.floor(ms/1000);
  const h = Math.floor(s/3600);
  const m = Math.floor((s%3600)/60);
  const sec = s%60;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
}
function msToHours(ms){ return ms/3600000; }
function formatHours(h){ return h.toFixed(1)+'h'; }

function formatDateBR(iso){
  if(!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric'});
}
function dayLabel(dateStr){
  const t = todayStr();
  const y = new Date(Date.now()-86400000).toISOString().slice(0,10);
  if(dateStr===t) return 'Hoje — '+formatDateBR(dateStr);
  if(dateStr===y) return 'Ontem — '+formatDateBR(dateStr);
  const d = new Date(dateStr+'T12:00:00');
  const weekday = d.toLocaleDateString('pt-BR',{weekday:'long'});
  return weekday.charAt(0).toUpperCase()+weekday.slice(1)+' — '+formatDateBR(dateStr);
}

// Week helpers (Monday-based)
function getWeekStart(dateStr){
  const d = new Date(dateStr+'T12:00:00');
  const day = d.getDay();
  const diff = day===0 ? 6 : day-1;
  const mon = new Date(d);
  mon.setDate(mon.getDate()-diff);
  return mon.toISOString().slice(0,10);
}
function getWeekEnd(weekStart){
  const d = new Date(weekStart+'T12:00:00');
  d.setDate(d.getDate()+6);
  return d.toISOString().slice(0,10);
}
function getMonthKey(dateStr){ return dateStr.slice(0,7); }

function getElapsedMs(task){
  let total = task.accumulatedMs || 0;
  if(task.status==='running' && task.lastStarted){
    total += Date.now() - new Date(task.lastStarted).getTime();
  }
  return total;
}

// ===== SPECIAL CLIENTS =====
const SPECIAL_CLIENTS = {
  'Tweed': 'Alinhamento com Equipe',
  'Descanso': 'Descanso',
  'Felipe': 'Coisas Pessoais'
};

function resolveTaskName(name, client){
  if(name) return name;
  if(SPECIAL_CLIENTS[client]) return SPECIAL_CLIENTS[client];
  return '';
}

// ===== TASK ACTIONS =====
function createTask(){
  const nameEl = document.getElementById('taskName');
  const clientEl = document.getElementById('taskClient');
  let name = nameEl.value.trim();
  const client = clientEl.value.trim();
  if(!client){ clientEl.focus(); return; }
  name = resolveTaskName(name, client);
  if(!name){ nameEl.focus(); return; }

  data.tasks.forEach(t=>{
    if(t.status==='running'){
      t.accumulatedMs = getElapsedMs(t);
      t.lastStarted = null;
      t.status = 'paused';
    }
  });

  const task = {
    id: genId(),
    name,
    client,
    startDay: todayStr(),
    createdAt: nowISO(),
    completedAt: null,
    status: 'running',
    lastStarted: nowISO(),
    accumulatedMs: 0
  };
  data.tasks.unshift(task);
  saveData();
  nameEl.value = '';
  clientEl.value = '';
  nameEl.focus();
  render();
}

function pauseTask(id){
  const t = data.tasks.find(x=>x.id===id);
  if(!t||t.status!=='running') return;
  t.accumulatedMs = getElapsedMs(t);
  t.lastStarted = null;
  t.status = 'paused';
  saveData();
  render();
}

function resumeTask(id){
  data.tasks.forEach(t=>{
    if(t.status==='running'){
      t.accumulatedMs = getElapsedMs(t);
      t.lastStarted = null;
      t.status = 'paused';
    }
  });
  const t = data.tasks.find(x=>x.id===id);
  if(!t||t.status!=='paused') return;
  t.status = 'running';
  t.lastStarted = nowISO();
  saveData();
  render();
}

function completeTask(id){
  const t = data.tasks.find(x=>x.id===id);
  if(!t||t.status==='completed') return;
  t.accumulatedMs = getElapsedMs(t);
  t.lastStarted = null;
  t.status = 'completed';
  t.completedAt = nowISO();
  saveData();
  render();
}

// ===== ARCHIVE OLD WEEKS =====
function archiveOldWeeks(){
  const currentWeekStart = getWeekStart(todayStr());
  const pastTasks = data.tasks.filter(t => t.status==='completed' && getWeekStart(t.startDay) < currentWeekStart);
  if(pastTasks.length===0) return;

  const weekMap = {};
  pastTasks.forEach(t=>{
    const ws = getWeekStart(t.startDay);
    if(!weekMap[ws]) weekMap[ws] = [];
    weekMap[ws].push(t);
  });

  for(const ws in weekMap){
    const existing = data.archivedWeeks.find(a=>a.weekStart===ws);
    if(!existing){
      const breakdown = buildBreakdown(weekMap[ws]);
      data.archivedWeeks.push({
        weekStart: ws,
        weekEnd: getWeekEnd(ws),
        breakdown,
        tasks: weekMap[ws].map(t=>({name:t.name,client:t.client,ms:t.accumulatedMs,startDay:t.startDay,completedAt:t.completedAt}))
      });
    }
  }
  data.archivedWeeks.sort((a,b)=>b.weekStart.localeCompare(a.weekStart));
  saveData();
}

function buildBreakdown(tasks){
  const clients = {};
  let totalMs = 0;
  tasks.forEach(t=>{
    const ms = t.accumulatedMs || t.ms || 0;
    totalMs += ms;
    if(!clients[t.client]) clients[t.client] = {hours:0, count:0};
    clients[t.client].hours += msToHours(ms);
    clients[t.client].count++;
  });
  return {totalHours: msToHours(totalMs), clients};
}

// ===== RENDER =====
let timerInterval = null;
function startTimerInterval(){
  if(timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(()=>{
    // Update running task timers
    data.tasks.forEach(t=>{
      if(t.status==='running'){
        const el = document.getElementById('timer-'+t.id);
        if(el) el.textContent = formatDuration(getElapsedMs(t));
      }
    });
    // Update day totals
    const dayTotals = document.querySelectorAll('[data-day-total]');
    dayTotals.forEach(el=>{
      const day = el.getAttribute('data-day-total');
      const tasks = data.tasks.filter(t=>t.startDay===day);
      const dayMs = tasks.reduce((s,t)=>s+getElapsedMs(t),0);
      el.textContent = formatDuration(dayMs);
    });
    // Update breakdown text only (no chart re-render)
    updateBreakdownText();
  }, 1000);
}

function render(){
  archiveOldWeeks();
  renderTasks();
  renderBreakdowns();
  updateClientDatalist();

}

      }

// ===== BREAKDOWNS =====

function getBreakdownData(){
  const currentWeekStart = getWeekStart(todayStr());
  const currentMonthKey = getMonthKey(todayStr());

  const weekTasks = data.tasks.filter(t=>getWeekStart(t.startDay)===currentWeekStart);
  const weekBreakdown = buildBreakdownLive(weekTasks);

  const monthTasks = data.tasks.filter(t=>getMonthKey(t.startDay)===currentMonthKey);
  const archivedMonthTasks = [];
  data.archivedWeeks.forEach(aw=>{
    if(getMonthKey(aw.weekStart)===currentMonthKey){
      aw.tasks.forEach(t=>archivedMonthTasks.push(t));
    }
  });
  const monthTaskIds = new Set(monthTasks.map(t=>t.id));
  const dedupedMonth = [...monthTasks, ...archivedMonthTasks.filter(t=>!monthTaskIds.has(t.id))];
  const monthBreakdown = buildBreakdownLive(dedupedMonth);

  const prevWeeks = data.archivedWeeks.filter(a=>a.weekStart!==currentWeekStart);

  return {currentWeekStart, currentMonthKey, weekBreakdown, monthBreakdown, prevWeeks};
}

function renderBreakdowns(){
  const container = document.getElementById('breakdownsContainer');

  // WEEKLY

        <div class="chart-box"><canvas id="weekPie"></canvas></div>

  html += `<div class="breakdown-section">
    <div class="breakdown-header">
      <span>Mensal · ${monthName.charAt(0).toUpperCase()+monthName.slice(1)}</span>
      <span class="total-hours" id="monthTotalHours">${formatHours(monthBreakdown.totalHours)}</span>

      </div>

  container.innerHTML = html;

  // Charts only rendered here (on full render), not on tick
  setTimeout(()=>{
    renderCharts('weekBar','weekPie', weekBreakdown.clients);
    renderCharts('monthBar','monthPie', monthBreakdown.clients);
  },50);
}

// Lightweight text-only update called every second — no chart rebuild
function updateBreakdownText(){
  const {weekBreakdown, monthBreakdown} = getBreakdownData();

  const wTotal = document.getElementById('weekTotalHours');
  if(wTotal) wTotal.textContent = formatHours(weekBreakdown.totalHours);
  const wRows = document.getElementById('weekClientRows');
  if(wRows) wRows.innerHTML = renderClientRows(weekBreakdown.clients);

  const mTotal = document.getElementById('monthTotalHours');
  if(mTotal) mTotal.textContent = formatHours(monthBreakdown.totalHours);
  const mRows = document.getElementById('monthClientRows');
  if(mRows) mRows.innerHTML = renderClientRows(monthBreakdown.clients);
}

function buildBreakdownLive(tasks){
  const clients = {};
  let totalMs = 0;
  tasks.forEach(t=>{
    const ms = t.accumulatedMs!==undefined ? getElapsedMs(t) : (t.ms||0);
    totalMs += ms;
    if(!clients[t.client]) clients[t.client] = {hours:0, count:0};
    clients[t.client].hours += msToHours(ms);
    clients[t.client].count++;
  });
  return {totalHours: msToHours(totalMs), clients};
}

function renderClientRows(clients){
  const entries = Object.entries(clients).sort((a,b)=>b[1].hours-a[1].hours);
  if(entries.length===0) return '<div style="color:var(--white3);padding:8px 0;font-size:.85rem">Nenhuma tarefa neste período</div>';
  return entries.map(([name,d])=>`
    <div class="client-row">
      <span class="client-name"><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${getClientColor(name)};margin-right:8px;vertical-align:middle"></span>${esc(name)}</span>
      <span class="client-stats">${formatHours(d.hours)} · ${d.count} tarefa${d.count>1?'s':''}</span>
    </div>`).join('');
}

function renderPrevWeeks(weeks){
  let html = '<div class="prev-weeks"><h4>Semanas anteriores</h4>';
  weeks.forEach(w=>{
    html += `<span class="week-link" onclick="showWeekModal('${w.weekStart}')">${formatDateBR(w.weekStart)} a ${formatDateBR(w.weekEnd)}</span>`;
  });

}

const FALLBACK_COLORS = ['#a29bfe','#fd79a8','#00cec9','#fdcb6e','#e17055','#74b9ff','#55efc4','#fab1a0','#81ecec','#dfe6e9'];

function getClientColor(name){
  if(CLIENT_COLORS[name]) return CLIENT_COLORS[name];
  // Deterministic fallback based on name hash
  let hash = 0;
  for(let i=0;i<name.length;i++) hash = ((hash<<5)-hash)+name.charCodeAt(i);
  return FALLBACK_COLORS[Math.abs(hash) % FALLBACK_COLORS.length];
}

let chartInstances = {};
function renderCharts(barId, pieId, clients){
  const barCanvas = document.getElementById(barId);
  const pieCanvas = document.getElementById(pieId);
  if(!barCanvas||!pieCanvas) return;

  const entries = Object.entries(clients).sort((a,b)=>b[1].hours-a[1].hours);
  if(entries.length===0) return;

  const labels = entries.map(e=>e[0]);
  const values = entries.map(e=>Math.round(e[1].hours*100)/100);
  const colors = labels.map(name=>getClientColor(name));

  if(chartInstances[barId]) chartInstances[barId].destroy();
  if(chartInstances[pieId]) chartInstances[pieId].destroy();

  chartInstances[barId] = new Chart(barCanvas, {
    type:'bar',
    data:{labels, datasets:[{data:values, backgroundColor:colors, borderRadius:4, maxBarThickness:48}]},
    options:{
      responsive:true, maintainAspectRatio:true,
      plugins:{legend:{display:false},tooltip:{
        backgroundColor:'#161825',borderColor:'#1e2130',borderWidth:1,
        titleColor:'#fff',bodyColor:'#c8ccd8',
        callbacks:{label:ctx=>formatHours(ctx.raw)}
      }},
      scales:{
        x:{ticks:{color:'#8a8fa6',font:{family:'Inter',size:11}},grid:{display:false}},
        y:{ticks:{color:'#8a8fa6',font:{family:'Inter'},callback:v=>v+'h'},grid:{color:'#1e2130'}}
      }
    }
  });

  chartInstances[pieId] = new Chart(pieCanvas, {
    type:'pie',
    data:{labels, datasets:[{data:values, backgroundColor:colors, borderWidth:2, borderColor:'#0b0c13'}]},
    options:{
      responsive:true, maintainAspectRatio:true,
      plugins:{legend:{position:'bottom',labels:{color:'#8a8fa6',font:{family:'Inter',size:11},padding:10}},
        tooltip:{
          backgroundColor:'#161825',borderColor:'#1e2130',borderWidth:1,
          titleColor:'#fff',bodyColor:'#c8ccd8',
          callbacks:{label:ctx=>`${ctx.label}: ${formatHours(ctx.raw)}`}
        }
      }
    }
  });
}

function createManualTask(){

  closeManualModal();
  render();

// ===== EXPORT CSV =====
function getWeekdayName(dateStr){
  const d = new Date(dateStr+'T12:00:00');
  const name = d.toLocaleDateString('pt-BR',{weekday:'long'});
  return name.charAt(0).toUpperCase()+name.slice(1);
}

function formatDurationHM(ms){
  if(ms<0) ms=0;
  const totalMin = Math.round(ms/60000);
  const h = Math.floor(totalMin/60);
  const m = totalMin%60;
  return `${h}h${String(m).padStart(2,'0')}min`;
}

function csvEscape(val){
  const s = String(val);
  if(s.includes(',') || s.includes('"') || s.includes('\n')) return '"'+s.replace(/"/g,'""')+'"';
  return s;
}

function exportCSV(){
  // Gather all tasks: current + archived
  const rows = [];
  // Current tasks
  data.tasks.forEach(t=>{
    rows.push({
      weekday: getWeekdayName(t.startDay),
      startDate: formatDateBR(t.createdAt),
      name: t.name,
      client: t.client,
      duration: formatDurationHM(getElapsedMs(t)),
      completedDate: t.completedAt ? formatDateBR(t.completedAt) : 'Em andamento'
    });
  });
  // Archived tasks
  data.archivedWeeks.forEach(aw=>{
    aw.tasks.forEach(t=>{
      // Skip if already in current tasks
      if(data.tasks.some(ct=>ct.name===t.name && ct.client===t.client && ct.startDay===t.startDay)) return;
      rows.push({
        weekday: getWeekdayName(t.startDay),
        startDate: formatDateBR(t.startDay+'T12:00:00'),
        name: t.name,
        client: t.client,
        duration: formatDurationHM(t.ms),
        completedDate: t.completedAt ? formatDateBR(t.completedAt) : 'Concluída'
      });
    });
  });

  if(rows.length===0){ alert('Nenhuma tarefa para exportar.'); return; }

  const header = 'Dia da Semana,Data de Início,Tarefa,Cliente,Tempo Total,Data de Conclusão';
  const csvLines = rows.map(r=>
    [r.weekday, r.startDate, r.name, r.client, r.duration, r.completedDate].map(csvEscape).join(',')
  );
  const csv = '﻿' + header + '\n' + csvLines.join('\n');

  const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'time-tracker-export.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// ===== INIT =====
(async function init(){
  // Show local cache immediately so UI isn't blank
  data = loadLocalCache();
  render();
  // Then try to fetch fresher data from API
  updateSyncIndicator('loading');
  const remote = await loadDataFromAPI();
  if(remote){
    // Use remote if it has more data, or always prefer remote when available
    const remoteTotal = (remote.tasks?.length||0) + (remote.archivedWeeks?.length||0);
    const localTotal = (data.tasks?.length||0) + (data.archivedWeeks?.length||0);
    if(remoteTotal >= localTotal || _dataLoaded === false){
      data = remote;
      saveLocalCache(); // update local cache with remote data
      render();
    }
    updateSyncIndicator('saved');
  } else {
    // Running locally (no API) — that's fine
    updateSyncIndicator('');
    const el = document.getElementById('sync-status');
    if(el) el.textContent = '';
  }
  _dataLoaded = true;
})();

<script>
(() => {
  const motion = window.matchMedia('(prefers-reduced-motion: reduce)');
  const toggle = document.getElementById('background-toggle');
  let scene;
  let userPaused = false;
  let loading = false;

  function syncPlayback() {
    if (scene) scene.paused = userPaused || document.hidden || motion.matches;
    toggle.hidden = !scene || motion.matches;
  }

  async function initializeBackground() {
    if (motion.matches || loading || scene) return;
    loading = true;
    try {
      if (!window.UnicornStudio?.addScene) {
        await new Promise((resolve, reject) => {
          const script = document.createElement('script');
          script.src = 'https://cdn.jsdelivr.net/gh/hiunicornstudio/unicornstudio.js@v1.4.29/dist/unicornStudio.umd.js';
          script.onload = resolve;
          script.onerror = reject;
          document.head.appendChild(script);
        });
      }
      if (motion.matches) return;
      scene = await window.UnicornStudio.addScene({
        elementId: 'tweed-aura',
        filePath: 'tweed-aura-scene',
        fps: 30,
        dpi: 1,
        interactivity: { mouse: { disable: true } }
      });
      syncPlayback();
    } catch (error) {
      // The solid brand background remains usable if WebGL or the CDN fails.
      console.warn('Fundo animado indisponível.', error);
    } finally {
      loading = false;
    }
  }

  toggle.addEventListener('click', () => {
    userPaused = !userPaused;
    toggle.textContent = userPaused ? 'Animar fundo' : 'Pausar fundo';
    toggle.setAttribute('aria-pressed', String(userPaused));
    syncPlayback();
  });
  document.addEventListener('visibilitychange', syncPlayback);
  motion.addEventListener('change', () => {
    syncPlayback();
    initializeBackground();
  });
  initializeBackground();
})();
</script>
